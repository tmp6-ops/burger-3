<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍔 The Infinity Burger 🍔</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <!-- Header / HUD -->
    <header class="hud">
      <div class="hud-item height-box">
        <span class="label">HEIGHT</span>
        <span class="val"><span id="layer-count">0</span> <small>layers</small></span>
      </div>
      <div class="hud-item meter-box">
        <span class="label">ALTITUDE</span>
        <span class="val" id="altitude-display">0.0 m</span>
      </div>
      <div class="hud-item score-box">
        <span class="label">CALORIES</span>
        <span class="val" id="calorie-count">0</span>
      </div>
      <button id="audio-toggle-btn" class="audio-btn" title="Toggle Sound / BGM">
        🔊
      </button>
    </header>

    <!-- Zone / Milestone Banner -->
    <div id="milestone-banner" class="hidden">
      <span id="milestone-text">Entering The Stratosphere! 🚀</span>
    </div>

    <!-- Sky / Cosmic Atmosphere Indicators -->
    <div id="current-zone-tag">Kitchen Counter 🍳</div>

    <!-- Burger Viewport / Stacking World -->
    <div id="world-viewport">
      <div class="drop-hint">👇 Tap anywhere or press SPACE to drop!</div>
      <div id="burger-stack">
        <!-- Floating falling ingredient animation area -->
        <div id="plate">
          <div class="plate-base"></div>
          <div class="plate-lip"></div>
        </div>
        <!-- Stack elements get prepended/appended here -->
      </div>

      <!-- Falling drop preview / Target cursor -->
      <div id="spatula-chef">
        <div id="current-ingredient-preview"></div>
      </div>

      <!-- Particles & FX Canvas overlay -->
      <canvas id="fx-canvas"></canvas>
    </div>

    <!-- Bottom Controls & Selector -->
    <footer class="control-deck">
      <div class="deck-top">
        <div class="wobble-gauge-wrapper">
          <span class="gauge-label">TOWER STABILITY</span>
          <div class="gauge-bar-bg">
            <div id="stability-bar" style="width: 100%;"></div>
          </div>
        </div>
        <div class="combo-indicator" id="combo-display">COMBO x1</div>
      </div>

      <!-- Ingredient Hotbar -->
      <div class="ingredient-buttons" id="ingredient-palette">
        <!-- Generated by JS -->
      </div>

      <div class="actions">
        <button id="crown-btn" class="action-btn gold" title="Cap with top bun & score final feast!">
          👑 FINISH & SERVE BURGER
        </button>
        <button id="reset-btn" class="action-btn red" title="Clear and restart">
          🔄 RESTART
        </button>
      </div>
    </footer>

    <!-- Game Over / Feast Modal -->
    <div id="modal-overlay" class="hidden">
      <div class="modal-card">
        <div class="modal-badge" id="modal-emoji">🍔</div>
        <h2 id="modal-title">COLOSSAL TASTE!</h2>
        <p id="modal-subtitle">Your Infinity Burger has made galactic history.</p>

        <div class="modal-stats">
          <div class="stat-pill">
            <span class="stat-title">Layers</span>
            <span class="stat-num" id="end-layers">0</span>
          </div>
          <div class="stat-pill">
            <span class="stat-title">Peak Height</span>
            <span class="stat-num" id="end-height">0m</span>
          </div>
          <div class="stat-pill">
            <span class="stat-title">Calories</span>
            <span class="stat-num" id="end-calories">0</span>
          </div>
          <div class="stat-pill">
            <span class="stat-title">Cosmic Rank</span>
            <span class="stat-num" id="end-rank">Snack Byte</span>
          </div>
        </div>

        <button id="play-again-btn" class="glow-btn">STACK ANOTHER! 🍟</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
